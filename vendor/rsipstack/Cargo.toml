[package]
edition = "2021"
name = "rsipstack"
version = "0.5.9"
authors = ["jinti<shenjindi@fourz.cn>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SIP Stack Rust library for building SIP applications"
readme = "README.md"
keywords = [
    "sip",
    "voip",
    "telephony",
    "sipstack",
]
categories = [
    "network-programming",
    "multimedia",
]
license = "MIT"
repository = "https://github.com/restsend/rsipstack"

[features]
all-transports = [
    "rustls",
    "websocket",
    "srv_lookup",
]
default = [
    "rustls",
    "websocket",
    "srv_lookup",
]
rustls = [
    "tokio-rustls",
    "rustls-pemfile",
]
srv_lookup = ["dep:hickory-resolver"]
websocket = ["tokio-tungstenite"]

[lib]
name = "rsipstack"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[bin]]
name = "bench_ua"
path = "src/bin/bench_ua.rs"

[[example]]
name = "client"
path = "examples/client/main.rs"

[[example]]
name = "proxy"
path = "examples/proxy.rs"

